  min: 1
  max: 9999
  description: "Discourse AI agent id for the Logos matchmaker door"
ai_guides_omega_agent_id:
  default: 4
  type: integer
  min: 1
  max: 9999
  description: "Discourse AI agent id for the Omega Scripture-teacher door"

# ---------------------------------------------------------------------------
# Per-block ordering
# ---------------------------------------------------------------------------
# Each block has a DESKTOP order (its position within its own column, >900px)
# and a MOBILE order (its position in the single global stack, <=900px).
# Lower numbers appear first. Defaults reproduce the current layout:
#   desktop = sequence within each column (1,2,3…)
#   mobile  = left column, then middle, then right (10,20,30… with gaps to
#             insert between). To move a block up on mobile, give it a lower
#             number than the block you want it above.
# Every block must keep a value; a blank/0 would jump it to the top.

# ---------------------------------------------------------------------------
# Per-block DESKTOP column assignment
# ---------------------------------------------------------------------------
# Which of the three desktop columns each block lives in. Within a column the
# block's *_desktop order setting decides position. Defaults reproduce the
# current layout. Mobile is unaffected — on mobile all columns dissolve into a
# single stack ordered by the *_mobile settings, so column choice is
# desktop-only. When moving a block to a new column, also adjust its
# *_desktop order so it seats correctly among its new neighbors.
# ── Block placement + kill switch ───────────────────────────────────────
# Each column_* setting places its block in a desktop column — or turns it
# OFF entirely ("off" removes the block from desktop AND mobile; e.g. set
# column_my_matches to off on a site without matchmaking). Settings are
# per-site, so each site curates its own Plaza from the same component.
column_profile_status:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_my_matches:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_hot_topics:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_new_faces:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_staff_picks:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_quote:
  default: "left"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_leaderboard:
  default: "middle"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_rankings:
  default: "middle"
  type: enum
  choices: ["left", "middle", "right", "off"]
column_mood:
