# ═══════════════════════════════════════════════════════════════════════
# LOOK & FEEL (2.0.0; topic list settings 2.1.0; frame and trim 2.2.0; categories page 2.3.0; topic page 2.4.0). Colours are edited in Admin → Appearance → Colour
# palettes (VC Flame Light / VC Flame Dark by default). These settings
# control everything else about how the site looks.
# ═══════════════════════════════════════════════════════════════════════

font_pairing:
  type: enum
  default: inter_newsreader
  choices:
    - inter_newsreader
    - inter_only
    - admin_fonts
  description: "Fonts. inter_newsreader = Inter for text, Newsreader for headings. inter_only = Inter everywhere. admin_fonts = use the fonts chosen in Admin → Appearance → Fonts."

heading_weight:
  type: enum
  default: medium
  choices:
    - regular
    - medium
    - semibold
  description: "How heavy headings and titles look."

corner_style:
  type: enum
  default: soft
  choices:
    - square
    - soft
    - round
  description: "Corner rounding for cards, inputs and panels. square 4–8px, soft 8–16px, round 10–20px."

button_shape:
  type: enum
  default: pill
  choices:
    - pill
    - rounded
  description: "Button shape. pill = fully rounded ends; rounded = matches the corner style."

card_style:
  type: enum
  default: outlined
  choices:
    - flat
    - outlined
    - raised
  description: "How cards separate from the page. flat = background only, outlined = hairline border, raised = hairline plus soft shadow."

density:
  type: enum
  default: comfortable
  choices:
    - comfortable
    - compact
  description: "Spacing of sidebar rows, topic rows and card padding."

page_background:
  type: enum
  default: white
  choices:
    - paper
    - white
    - tinted
  description: "Page background behind the cards. white = plain (2.2.0 default; cards get a stronger shadow so they don't wash out), paper = warm off-white derived from the accent, tinted = a stronger accent tint. All follow the colour palette, including dark mode."

header_style:
  type: enum
  default: palette
  choices:
    - palette
    - night
  description: "Site header when frame_style is none. palette = the colour palette's header colours. night = the dark brand colour in both modes (check the logo reads on it first). With frame_style night the header is always night."

frame_style:
  type: enum
  default: night
  choices:
    - night
    - none
  description: "Frame around the page (2.2.0). night = header, welcome banner, sidebar and phone tab bar in the dark brand colour, around a light reading area; dark mode looks as before. none = 2.1.0 look (header follows header_style)."

accent_trim:
  type: bool
  default: true
  description: "Flame trim (2.2.0): a thin flame-to-wine stripe under the header and above the phone tab bar, a thicker flame underline on the active tab, flame reply counts, and flame gradient primary buttons."

card_edge:
  type: enum
  default: all
  choices:
    - all
    - new_activity
    - hover
    - none
  description: "Flame edge on the left of topic cards (2.2.0). all = every card; new_activity = only topics with new or unread posts; hover = when the pointer is over a card; none = no edge."

sidebar_style:
  type: enum
  default: quiet
  choices:
    - quiet
    - tiles
    - text
  description: "Sidebar icons. quiet = one neutral tile, only the current page takes the accent. tiles = a colour per kind of destination. text = plain icons."

welcome_banner_style:
  type: enum
  default: compact
  choices:
    - full
    - compact
    - hidden
  description: "Size of the 'Welcome back' banner on topic lists. To switch it off entirely you can also use 'Enable welcome banner' under Settings the theme can override."

topic_list_layout:
  type: enum
  default: cards
  choices:
    - cards
    - classic
  description: "Topic lists (Latest, New, Unread, Top, Hot, categories and tags). cards = each topic is a card with an excerpt, posters, replies and date; the whole card opens the topic. classic = Discourse's table with sortable columns."

topic_card_excerpt_lines:
  type: integer
  default: 2
  min: 0
  max: 4
  description: "Lines of excerpt on each topic card. 0 = no excerpts (pinned topics still show theirs). Excerpts that would only repeat the title are left out."

topic_card_views:
  type: bool
  default: false
  description: "Show the view count on topic cards (desktop and tablet)."

categories_layout:
  type: enum
  default: cards
  choices:
    - cards
    - classic
  description: "Categories page (2.3.0). cards = each category is a card with its name, description, subcategory chips and topic count, and the whole card opens the category; the Latest column beside it becomes cards too. classic = Discourse's table."

category_edge:
  type: enum
  default: category
  choices:
    - category
    - flame
    - none
  description: "Edge on the left of each category card (2.3.0). category = the category's own colour (set in each category's settings); flame = the brand flame; none = no edge."

category_logo:
  type: enum
  default: small
  choices:
    - small
    - hidden
    - full
  description: "Uploaded category logos on the categories page (2.3.0). small = a 40px thumbnail beside the name; hidden = not shown; full = Discourse's own size."

topic_layout:
  type: enum
  default: cards
  choices:
    - cards
    - classic
  description: "Topic page (2.4.0). cards = the first post and each reply thread sit on cards, with VC type for the post body, quotes and code; messages and flat topics get the same author line and post type. classic = Discourse's topic page."

topic_reading_width:
  type: integer
  default: 690
  min: 560
  max: 820
  description: "Width of the post column in pixels (2.4.0; cards layout). 690 = Discourse's default. Narrower reads more comfortably on large screens."

post_author_style:
  type: enum
  default: name_title
  choices:
    - name_title
    - name_only
  description: "Author line on posts (2.4.0; cards layout). name_title = name plus title or group, as Discourse shows it; name_only = just the name."

content_width:
  type: integer
  default: 1200
  min: 960
  max: 1600
  description: "Maximum width of the main content in pixels (the Feed keeps its own wider layout)."

motion:
  type: bool
  default: true
  description: "Hover and transition animations. Members who ask their device for reduced motion never get them."

